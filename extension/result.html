<!doctype html>
<meta charset="utf-8">
<title>JustSave</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: light-dark(#e8e8e8, #18191c); }
  header { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; background: light-dark(#fff, #202124); box-shadow: 0 1px 4px #0003; }
  #zoombar { margin-left: auto; display: flex; gap: 4px; align-items: center; }
  #zoom { min-width: 4em; text-align: center; font-variant-numeric: tabular-nums; }
  #logo { display: block; height: 32px; }
  button, select { padding: 6px 14px; font: inherit; cursor: pointer; }
  #status { margin-left: 8px; color: light-dark(#555, #aaa); }
  #stage { position: relative; width: fit-content; margin: 16px auto; overflow: clip; box-shadow: 0 1px 6px #0004; }
  #shot { display: block; }
  #stage.cropping { cursor: crosshair; touch-action: none; user-select: none; }
  #stage.cropping #shot { pointer-events: none; }
  #sel { position: absolute; outline: 1px dashed #fff; box-shadow: 0 0 0 100vmax #0008; cursor: move; }
  #sel i { position: absolute; width: 10px; height: 10px; background: #fff; border: 1px solid #000; }
  #sel [data-h*=n] { top: 0; } #sel [data-h*=s] { bottom: 0; } #sel [data-h*=w] { left: 0; } #sel [data-h*=e] { right: 0; }
  #sel [data-h=n], #sel [data-h=s] { left: calc(50% - 6px); cursor: ns-resize; }
  #sel [data-h=e], #sel [data-h=w] { top: calc(50% - 6px); cursor: ew-resize; }
  #sel [data-h=nw], #sel [data-h=se] { cursor: nwse-resize; }
  #sel [data-h=ne], #sel [data-h=sw] { cursor: nesw-resize; }
  @media print {
    header, #sel { display: none; }
    body { background: none; }
    #stage { margin: 0; box-shadow: none; }
    #shot { width: auto !important; max-width: 100%; }
  }
</style>
<header>
  <select id="format" aria-label="Format">
    <option value="png">PNG</option>
    <option value="jpg">JPG</option>
    <option value="pdf">PDF</option>
  </select>
  <select id="quality" aria-label="Quality">
    <option value="0.92">High</option>
    <option value="0.8">Medium</option>
    <option value="0.6">Low</option>
  </select>
  <button data-act="save">Save…</button>
  <button data-act="download">Download</button>
  <button data-act="copy">Copy</button>
  <button data-act="print">Print</button>
  <button id="crop" title="Drag over the capture to pick the area to keep (Enter applies, Esc cancels)">Crop</button>
  <button id="uncrop" hidden>Undo crop</button>
  <span id="status" role="status"></span>
  <span id="zoombar">
    <button data-zoom="fit" title="Whole capture in the window">Fit</button>
    <button data-zoom="width" title="Fit the width and scroll down">Fit width</button>
    <button data-zoom="out" aria-label="Zoom out">−</button>
    <span id="zoom"></span>
    <button data-zoom="in" aria-label="Zoom in">+</button>
  </span>
  <picture>
    <source srcset="assets/logo-dark.png" media="(prefers-color-scheme: dark)">
    <img id="logo" src="assets/logo-light.png" alt="JustSave">
  </picture>
</header>
<div id="stage"><img id="shot" alt="Captured page"><div id="sel" hidden><i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i><i data-h="e"></i><i data-h="se"></i><i data-h="s"></i><i data-h="sw"></i><i data-h="w"></i></div></div>
<script type="module" src="result.js"></script>
