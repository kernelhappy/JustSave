<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; font: 14px system-ui, sans-serif; }
  button { padding: 8px 16px; font: inherit; cursor: pointer; }
  #note { flex-basis: 100%; margin: 0; color: #666; }
</style>
<p id="note" hidden>Chrome doesn't let extensions run on this page, so only Visible area can work here.</p>
<button data-mode="visible">Visible area</button>
<button data-mode="full">Full page</button>
<button data-mode="fast" title="One shot via the DevTools protocol: faster, no seams, but full-height sections can stretch and embeds can come out blank">Full page (fast)</button>
<script type="module" src="popup.js"></script>
